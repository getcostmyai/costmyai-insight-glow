name: Lint - guarded-table is_synthetic check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-is-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint . --config eslint.ci.config.js
