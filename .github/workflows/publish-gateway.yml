# Publishes the CostMyAI gateway container image to GHCR.
#
# Manual only (workflow_dispatch): publishing an image customers paste into a
# `docker run` is a release decision, not something every push should do.
#
# Auth is the built-in GITHUB_TOKEN — no PAT, no secret to rotate. It is scoped
# to this repository and granted `packages: write` below.
#
# Dispatch 233 — two release lines, and they are not interchangeable:
#
#   v1  FROZEN. Local classification does not exist in that binary. `v1` is a
#       moving tag customers already run, so a rebuild of it from today's tree
#       would put a content-reading classifier into containers whose operators
#       agreed to a container that had none — even switched off, the capability
#       and the audit answer both change. This workflow refuses to publish it.
#   v2  The locally-classifying line. Same source, built with
#       CLASSIFY_LOCAL_DEFAULT=true so local classification is ON by default in
#       that tag only. A customer reaches it by naming it, and can still opt out
#       per-container with COSTMYAI_CLASSIFY_LOCAL=false.
#
# Dispatch 236 adds a third line, and for the same reason v1 was frozen:
#
#   v3  The remotely-CAPABLE line. It contains the remote classification path,
#       which v2 does not: when the local rules abstain, the extracted prompt
#       text can be sent to CostMyAI to be labelled by a model — off the request
#       path, but it does leave the customer's network. v2's documented claim is
#       "structural shape only, never meaning"; that claim is FALSE under remote
#       classification, and a claim must not stop being true under a tag
#       customers already run. So v3 is a new line, never a v2 rebuild.
#
# Amendment, 30 August 2026 — remote classification is OPT-IN on v3:
# v3 is built with CLASSIFY_REMOTE_DEFAULT=false, the same off-by-default
# posture as v1 and v2, because the previous build made the homepage/pricing
# claim "metadata only, never your prompt content" false for any customer
# running the quickstart's own default command. An operator opts in explicitly
# with COSTMYAI_CLASSIFY_REMOTE=true; left unset, v3 behaves exactly like v2.
name: Publish gateway container

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release tag (must match packages/gateway-container/package.json), e.g. v3.0.0"
        required: true
        default: "v3.0.0"
      line:
        description: "Release line. v2 and v3 are publishable; v1 is frozen at its shipped digest."
        required: true
        default: "v3"
        type: choice
        options:
          - v2
          - v3

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Belt and braces: the choice list already excludes v1, but a workflow
      # file can be edited faster than this reason can be re-derived.
      - name: Refuse to republish the frozen v1 line
        if: ${{ inputs.line != 'v2' && inputs.line != 'v3' }}
        run: |
          echo "v1 is frozen at ghcr.io/getcostmyai/gateway:v1 (sha256:0818e270...)."
          echo "It predates local classification and must keep predating it."
          echo "Publish the v2 or v3 line instead; see packages/gateway-container/DECISIONS.md §12."
          exit 1

      # The line and the version must agree. A v3 image pushed as v2.1.0 — or
      # worse, a v3 build landing on the moving `v2` tag — is exactly the silent
      # posture change this whole scheme exists to prevent.
      - name: Line and version must agree
        run: |
          case "${{ inputs.version }}" in
            "${{ inputs.line }}".*) ;;
            *) echo "Version ${{ inputs.version }} does not belong to line ${{ inputs.line }}."; exit 1 ;;
          esac

      - name: Check out the exact commit being released
        uses: actions/checkout@v4

      - name: Version input must match the package version
        run: |
          pkg="v$(node -p "require('./packages/gateway-container/package.json').version")"
          if [ "$pkg" != "${{ inputs.version }}" ]; then
            echo "packages/gateway-container/package.json says $pkg, workflow says ${{ inputs.version }}."
            exit 1
          fi

      # Fail before the registry login on a compile error, with readable tsc
      # output instead of a buried `exit code: 2` from a Docker layer.
      - name: Docker-parity compile check
        run: bash scripts/audit/container-build.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Three tags: the immutable release tag, the moving tag for the line being
      # released, and the commit the build came from. `v1` is NOT in this list
      # and must not be added — that is the whole guarantee. The moving tag is
      # the line input, so a v3 build can never land on `v2`.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Context is the repository root: the Dockerfile compiles
          # src/lib/ingest/contract.ts into the image.
          context: .
          file: packages/gateway-container/Dockerfile
          build-args: |
            CLASSIFY_LOCAL_DEFAULT=true
            CLASSIFY_REMOTE_DEFAULT=false
          push: true
          tags: |
            ghcr.io/getcostmyai/gateway:${{ inputs.version }}
            ghcr.io/getcostmyai/gateway:${{ inputs.line }}
            ghcr.io/getcostmyai/gateway:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "Pushed:"
          echo "  ghcr.io/getcostmyai/gateway:${{ inputs.version }}"
          echo "  ghcr.io/getcostmyai/gateway:${{ inputs.line }}   (local classification ON by default; remote OFF — opt in per-container with COSTMYAI_CLASSIFY_REMOTE=true)"
          echo "  ghcr.io/getcostmyai/gateway:sha-${{ github.sha }}"
          echo ""
          echo "v1 was not touched and must never be republished from this tree."
          echo ""
          echo "A newly created GHCR package is PRIVATE by default."
          echo "Flip it to Public once: github.com/orgs/getcostmyai/packages -> gateway"
          echo "  -> Package settings -> Change visibility -> Public"
